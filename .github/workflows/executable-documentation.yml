name: Executable documentation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.13.3'
          python-version: '3.13'
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked project dependencies
        run: uv sync --locked --group build
      - name: Extract pinned Linux compilers
        run: uv run --locked --project . python prototype/setup_linux.py
      - name: Build pinned console interpreter
        run: uv run --locked --project . --group build python prototype/build_interpreter.py
      - name: Test runner contracts
        run: uv run --locked --project . python -m unittest discover -s prototype -p test_runner.py
      - name: Compile, play, and check documentation
        run: >-
          uv run --locked --project . python prototype/run.py
          --inform7 prototype/build/inform-linux/usr/lib/x86_64-linux-gnu/inform7-ide/inform7
          --inform6 prototype/build/inform-linux/usr/lib/x86_64-linux-gnu/inform7-ide/inform6
          --internal prototype/build/inform-linux/usr/share/inform7-ide
          --check
      - name: Render all-sample preview
        run: uv run --locked --project . python prototype/preview.py
      - name: Save diagnostic logs and transcripts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: executable-documentation-diagnostics
          if-no-files-found: ignore
          retention-days: 7
          path: |
            prototype/build/interpreter-build.log
            prototype/build/*/compiler-*.log
            prototype/build/*/story.ni
            prototype/build/*/console-output.txt
            prototype/build/*/transcript.txt
            prototype/build/*/example.json
            prototype/build/examples.json
            prototype/build/terminal-preview.html
