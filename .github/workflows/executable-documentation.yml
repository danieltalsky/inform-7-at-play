name: Executable documentation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-verify:
    name: Build and verify documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.3'
          python-version: '3.13'
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked project dependencies
        run: uv sync --locked --group build
      - name: Test static site export
        run: uv run --locked --project . python -m unittest test_site_builder
      - name: Build static site
        run: uv run --locked --project . python site_builder.py
      - name: Validate deployment scripts and mirror behavior
        run: |
          sudo apt-get update
          sudo apt-get install --yes lftp shellcheck
          shellcheck deploy/*.sh
          bash deploy/test_mirror.sh
      - name: Extract pinned Linux compilers
        run: uv run --locked --project . python prototype/setup_linux.py
      - name: Build pinned console interpreter
        run: uv run --locked --project . --group build python prototype/build_interpreter.py
      - name: Test runner contracts
        run: uv run --locked --project . python -m unittest discover -s prototype -p test_runner.py
      - name: Compile, play, and check documentation
        run: >-
          uv run --locked --project . python prototype/run.py
          --inform7 prototype/build/inform-linux/usr/lib/x86_64-linux-gnu/inform7-ide/inform7
          --inform6 prototype/build/inform-linux/usr/lib/x86_64-linux-gnu/inform7-ide/inform6
          --internal prototype/build/inform-linux/usr/share/inform7-ide
          --check
      - name: Render all-sample preview
        run: uv run --locked --project . python prototype/preview.py
      - name: Save deployable site
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: static-site
          path: dist/
          if-no-files-found: error
          retention-days: 7
      - name: Download deployment artifact for verification
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: static-site
          path: prototype/build/site-artifact
      - name: Verify deployment artifact matches the build
        run: diff --recursive dist prototype/build/site-artifact
      - name: Save diagnostic logs and transcripts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: executable-documentation-diagnostics
          if-no-files-found: ignore
          retention-days: 7
          path: |
            prototype/build/interpreter-build.log
            prototype/build/*/compiler-*.log
            prototype/build/*/story.ni
            prototype/build/*/console-output.txt
            prototype/build/*/transcript.txt
            prototype/build/*/example.json
            prototype/build/examples.json
            prototype/build/terminal-preview.html

  deploy:
    name: Deploy via FTPS
    needs: build-and-verify
    if: >-
      github.ref == 'refs/heads/maestra' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: ftps-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check this is still the latest maestra revision
        id: latest
        shell: bash
        run: |
          latest=$(git ls-remote origin refs/heads/maestra | cut -f1)
          if [[ "$latest" == "$GITHUB_SHA" ]]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Skipping deployment of a superseded revision.'
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.latest.outputs.current == 'true'
        with:
          name: static-site
          path: dist
      - name: Install FTPS client
        if: steps.latest.outputs.current == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --yes lftp
      - name: Replace the site's public files
        if: steps.latest.outputs.current == 'true'
        env:
          FTP_HOST: ${{ vars.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ vars.FTP_PORT }}
        run: bash deploy/ftp.sh
